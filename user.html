<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | 3D Market</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f111a; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo-link { color: #fff; text-decoration: none; font-size: 28px; font-weight: bold; }
        .back-btn { padding: 10px 20px; background: #334155; border: none; border-radius: 8px; color: #fff; text-decoration: none; }
        .back-btn:hover { background: #475569; }
        .profile-container { display: flex; align-items: center; gap: 25px; background: #1a1d29; padding: 30px; border-radius: 16px; margin-bottom: 40px; position: relative; }
        .profile-avatar { width: 100px; height: 100px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; text-transform: uppercase; }
        .profile-info { display: flex; flex-direction: column; gap: 8px; }
        .profile-header-row { display: flex; align-items: center; gap: 15px; }
        .profile-nick { font-size: 20px; color: #94a3b8; font-weight: normal; text-transform: lowercase; }
        .profile-rating { display: flex; align-items: center; gap: 5px; color: #f59e0b; font-size: 18px; font-weight: bold; }
        .profile-reviews { color: #64748b; font-size: 14px; }
        .profile-username { font-size: 32px; font-weight: bold; letter-spacing: 1px; }
        
        .logout-btn { padding: 8px 16px; background: #ef4444; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-left: auto; transition: background 0.2s; }
        .logout-btn:hover { background: #dc2626; }
        .login-btn-profile { padding: 10px 20px; background: #4f46e5; border: none; border-radius: 8px; color: #fff; font-weight: bold; text-decoration: none; margin-left: auto; display: inline-block; transition: background 0.2s; cursor: pointer; }
        .login-btn-profile:hover { background: #4338ca; }

        .section-title-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; }
        .add-product-btn { padding: 8px 16px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-decoration: none; }
        .add-product-btn:hover { background: #16a34a; }
        
        .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .product-card { 
            position: relative; 
            background: #1a1d29; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            border: 1px solid transparent; 
            transition: transform 0.3s ease, border-color 0.3s ease, opacity 0.4s ease; 
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-4px); border-color: #4f46e5; }
        
        .card-media-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #0f111a;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .card-progress-bars {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        .card-progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .card-progress-bar.active {
            background: #6366f1;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.8);
        }
        
        .card-hover-zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 6;
        }
        .card-hover-segment {
            flex: 1;
            height: 100%;
            cursor: pointer;
        }

        .delete-card-btn {
            position: absolute;
            top: 22px;
            right: 22px;
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .delete-card-btn:hover { background: #ef4444; transform: scale(1.1); }
        .product-info { padding: 5px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 18px; margin-bottom: 8px; color: #fff; }
        .product-price { font-size: 20px; font-weight: bold; color: #10b981; margin-top: auto; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15,17,26,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: #1a1d29; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 28px; color: #94a3b8; cursor: pointer; }
        .close-modal:hover { color: #fff; }
        .modal h2 { margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #0f111a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .form-group select option { background: #1a1d29; color: #fff; }
        .submit-btn { width: 100%; padding: 12px; background: #4f46e5; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #4338ca; }
        .btn-secondary { background: #334155; margin-top: 10px; }
        .btn-secondary:hover { background: #475569; }
        
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .auth-tab-btn { flex: 1; background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: bold; padding: 8px; cursor: pointer; }
        .auth-tab-btn.active { color: #6366f1; border-bottom: 2px solid #6366f1; }
        .code-input-field { letter-spacing: 8px; font-size: 22px; text-align: center; font-weight: bold; }

        .toast-notification { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: none; }
        .version-badge { font-size: 11px; color: #22c55e; background: rgba(34,197,94,0.1); padding: 2px 6px; border-radius: 4px; float: right; }
    </style>
</head>
<body>

    <div id="toast" class="toast-notification"></div>

    <header>
        <a href="index.html" class="logo-link">3D Market</a>
        <a href="index.html" class="back-btn">— На главную</a>
    </header>

    <div class="profile-container">
        <div class="profile-avatar" id="user-avatar">?</div>
        <div class="profile-info">
            <div class="profile-header-row">
                <div class="profile-username" id="user-name">Загрузка...</div>
                <div class="profile-nick" id="user-nick">@username</div>
            </div>
            <div class="profile-header-row">
                <div class="profile-rating">★ 5.0</div>
                <div class="profile-reviews">(0 отзывов)</div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logoutUser()">Выйти</button>
        <button class="login-btn-profile" id="loginBtn" style="display: none;" onclick="openAuthModal()">Войти / Регистрация</button>
    </div>

    <div class="section-title-bar">
        <div class="section-title">Лучшие работы</div>
        <button class="add-product-btn" id="openModalBtn">+ Добавить модель</button>
    </div>

    <div class="works-grid" id="user-models-grid">
        <div style="color: #94a3b8; padding: 20px;">Загрузка ваших моделей...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ МОДЕЛИ -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2>Опубликовать новую работу</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label for="model-title">Название модели</label>
                    <input type="text" id="model-title" required placeholder="Например: Glock 17">
                </div>
                
                <div class="form-group">
                    <label for="model-category">Категория модели</label>
                    <select id="model-category" required>
                        <option value="characters">Персонажи (Characters)</option>
                        <option value="weapons">Оружие (Weapons)</option>
                        <option value="environment">Окружение (Environment)</option>
                        <option value="vehicles">Транспорт (Vehicles)</option>
                        <option value="architecture">Архитектура (Architecture)</option>
                        <option value="props" selected>Предметы / Прочее (Props)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model-file">Основной файл модели (.fbx, .obj, .zip)</label>
                    <input type="file" id="model-file" accept=".fbx,.obj,.zip" required>
                </div>

                <div class="form-group">
                    <label for="model-glb">Файл для 3D просмотра (.glb) <span style="color:#64748b;">(Необязательно)</span></label>
                    <input type="file" id="model-glb" accept=".glb,.gltf">
                </div>

                <div class="form-group">
                    <label for="model-polygons">Количество полигонов (Polygons)</label>
                    <input type="text" id="model-polygons" required placeholder="Например: 12500 или 12k">
                </div>
                <div class="form-group">
                    <label for="model-price">Цена (только число)</label>
                    <input type="text" id="model-price" required placeholder="19">
                </div>
                <div class="form-group">
                    <label for="model-img">Фото / Галерея превью (несколько картинок)</label>
                    <input type="file" id="model-img" accept="image/*" multiple required>
                </div>
                <div class="form-group">
                    <label for="model-desc">Описание модели</label>
                    <textarea id="model-desc" rows="3" placeholder="Опишите вашу 3D-модель..."></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Опубликовать</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ И РЕГИСТРАЦИИ -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAuthModal()">&times;</span>
            <span class="version-badge">v3.0 ПРЯМОЙ ПЕРЕХОД</span>
            
            <div class="auth-tabs" id="auth-tabs-header">
                <button class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">Вход</button>
                <button class="auth-tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <!-- Форма Входа -->
            <form id="auth-login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Логин или Email</label>
                    <input type="text" id="login-identifier" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>

            <!-- БЛОК РЕГИСТРАЦИИ -->
            <div id="auth-register-form" style="display: none;">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" placeholder="User3D">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" placeholder="••••••••">
                </div>

                <!-- КНОПКА МГНОВЕННО МЕНЯЕТ HTML СТИЛИ НА ПРЯМУЮ В МОМЕНТ НАЖАТИЯ -->
                <button type="button" class="submit-btn" id="reg-step1-btn" onclick="
                    document.getElementById('auth-register-form').style.display = 'none';
                    document.getElementById('auth-verify-form').style.display = 'block';
                    document.getElementById('auth-tabs-header').style.display = 'none';
                    document.getElementById('target-email-display').textContent = document.getElementById('reg-email').value || 'вашу почту';
                    sendRegisterRequestInBackground();
                ">Зарегистрироваться</button>
            </div>

            <!-- БЛОК ВВОДА 6-ЗНАЧНОГО КОДА -->
            <div id="auth-verify-form" style="display: none;">
                <h2 style="text-align: center;">Подтверждение Email</h2>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px; text-align: center;">
                    Мы отправили 6-значный код на почту:<br><b id="target-email-display" style="color: #6366f1;"></b>
                </p>
                <div class="form-group">
                    <input type="text" id="verify-code-input" class="code-input-field" maxlength="6" placeholder="123456" autocomplete="off">
                </div>
                <button type="button" class="submit-btn" id="verify-btn" onclick="handleVerifyCodeDirect()">Подтвердить код</button>
                <button type="button" class="submit-btn btn-secondary" onclick="resetRegisterStep()">Назад</button>
            </div>
        </div>
    </div>

<script>
    const STRAPI_BASE_URL = 'https://my-strapi-project-production-f85a.up.railway.app';
    const FALLBACK_IMG = 'https://placehold.co/600x400/1a1d29/94a3b8?text=Нет+превью';
    
    const modelGalleries = {};
    let pendingRegisterEmail = '';

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#22c55e';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function logoutUser() {
        localStorage.removeItem('token');
        localStorage.removeItem('jwt');
        localStorage.removeItem('username');
        localStorage.removeItem('user');
        showToast("Вы вышли из аккаунта");
        setTimeout(() => { window.location.reload(); }, 500);
    }

    function renderUnauthenticatedUI() {
        localStorage.removeItem('token');
        localStorage.removeItem('jwt');
        localStorage.removeItem('username');
        localStorage.removeItem('user');

        document.getElementById('user-name').textContent = "Вы не авторизованы";
        document.getElementById('user-nick').textContent = "";
        document.getElementById('user-avatar').textContent = "?";
        
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'inline-block';
        
        const openBtn = document.getElementById('openModalBtn');
        if (openBtn) openBtn.style.display = 'none';

        const grid = document.getElementById('user-models-grid');
        if (grid) {
            grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">Пожалуйста, войдите в аккаунт, чтобы управлять моделями.</div>';
        }
    }

    function openAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
        switchAuthTab('login');
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    function switchAuthTab(tab) {
        document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
        
        document.getElementById('auth-login-form').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('auth-register-form').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('auth-verify-form').style.display = 'none';
        document.getElementById('auth-tabs-header').style.display = 'flex';
    }

    // Вход
    async function handleLogin(e) {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/auth/local`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });

            const data = await res.json();

            if (!res.ok) {
                const errMsg = data.error?.message || 'Ошибка входа';
                if (errMsg.toLowerCase().includes('confirmed') || errMsg.toLowerCase().includes('подтвержден')) {
                    alert("Ваш Email ещё не подтвержден! Нажмите на Регистрацию и введите данные снова для получения 6-значного кода.");
                    document.getElementById('reg-email').value = identifier.includes('@') ? identifier : '';
                    switchAuthTab('register');
                    return;
                }
                throw new Error(errMsg);
            }

            localStorage.setItem('jwt', data.jwt);
            localStorage.setItem('token', data.jwt);
            localStorage.setItem('user', JSON.stringify(data.user));

            showToast("Успешная авторизация!");
            closeAuthModal();
            window.location.reload();
        } catch (err) {
            alert("ОШИБКА ВХОДА: " + err.message);
        }
    }

    // ФОНОВАЯ ОТПРАВКА ЗАПРОСА (Экран уже переключен через HTML!)
    async function sendRegisterRequestInBackground() {
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        pendingRegisterEmail = email;

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/auth/custom-register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                alert("Ошибка сервера при отправке кода: " + (data.error?.message || data.message || "Ошибка"));
            } else {
                showToast("Код успешно отправлен вам на почту!");
            }
        } catch (err) {
            alert("Ошибка сети при отправке кода: " + err.message);
        }
    }

    // ПРОВЕРКА 6-ЗНАЧНОГО КОДА ПО КЛИКУ
    async function handleVerifyCodeDirect() {
        const code = document.getElementById('verify-code-input').value.trim();

        if (!code || code.length !== 6) {
            alert("Введите 6-значный код из письма!");
            return;
        }

        const btn = document.getElementById('verify-btn');
        btn.disabled = true;
        btn.textContent = "Проверка...";

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/auth/verify-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingRegisterEmail, code })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'Неверный код!');

            localStorage.setItem('jwt', data.jwt);
            localStorage.setItem('token', data.jwt);
            localStorage.setItem('user', JSON.stringify(data.user));

            showToast("Аккаунт успешно подтверждён!");
            closeAuthModal();
            window.location.reload();
        } catch (err) {
            alert("ОШИБКА ПРОВЕРКИ КОДА: " + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Подтвердить код";
        }
    }

    function resetRegisterStep() {
        document.getElementById('auth-tabs-header').style.display = 'flex';
        document.getElementById('auth-verify-form').style.display = 'none';
        switchAuthTab('register');
    }

    /* --- ЛОГИКА ВИТРИНЫ И КАРТОЧЕК --- */
    function changeCardImage(modelId, index) {
        const gallery = modelGalleries[modelId];
        if (!gallery || !gallery[index]) return;

        const imgEl = document.getElementById(`card-img-${modelId}`);
        if (imgEl) imgEl.src = gallery[index];

        gallery.forEach((_, idx) => {
            const barEl = document.getElementById(`bar-${modelId}-${idx}`);
            if (barEl) {
                if (idx === index) barEl.classList.add('active');
                else barEl.classList.remove('active');
            }
        });
    }

    function resetCardImage(modelId) { changeCardImage(modelId, 0); }

    async function deleteModel(modelId) {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        if (!token) { alert("Ошибка авторизации."); return; }
        if (!confirm("Вы точно хотите удалить эту модель?")) return;

        try {
            const response = await fetch(`${STRAPI_BASE_URL}/api/models/${modelId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });

            if (response.status === 200 || response.status === 204) {
                showToast("Модель успешно удалена!");
                const cardEl = document.getElementById(`model-card-${modelId}`);
                if (cardEl) {
                    cardEl.style.opacity = '0';
                    cardEl.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        cardEl.remove();
                        const grid = document.getElementById('user-models-grid');
                        if (grid.querySelectorAll('[id^="model-card-"]').length === 0) {
                            grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">У вас пока нет опубликованных моделей</div>';
                        }
                    }, 400);
                }
                return;
            } 
            const errorText = await response.text();
            alert(`Ошибка: ${errorText}`);
        } catch (error) { alert(`Ошибка сети: ${error.message}`); }
    }

    async function loadUserModels() {
        const grid = document.getElementById('user-models-grid');
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        if (!grid) return;

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/models?populate=*&_t=${Date.now()}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error("Не удалось загрузить ваши работы.");

            const responseData = await res.json();
            const models = responseData.data || [];

            if (models.length === 0) {
                grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">У вас пока нет опубликованных моделей</div>';
                return;
            }

            grid.innerHTML = ''; 

            models.forEach(item => {
                const modelId = item.documentId || item.id;
                const attrs = item.attributes || item;
                const title = attrs.Title || "Без названия";
                const price = attrs.Price !== undefined ? attrs.Price : 0;

                let imgUrls = [];
                let rawPreviews = attrs.Previews || item.Previews;
                if (rawPreviews && rawPreviews.data) rawPreviews = rawPreviews.data;
                if (rawPreviews) {
                    const previewsArray = Array.isArray(rawPreviews) ? rawPreviews : [rawPreviews];
                    previewsArray.forEach(p => {
                        const target = p.attributes || p;
                        const url = target.url || p.url || '';
                        if (url) {
                            const fullUrl = url.startsWith('http') ? url : `${STRAPI_BASE_URL}${url}`;
                            imgUrls.push(fullUrl);
                        }
                    });
                }

                if (imgUrls.length === 0) imgUrls.push(FALLBACK_IMG);

                modelGalleries[modelId] = imgUrls;
                const hasMultiple = imgUrls.length > 1;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.id = `model-card-${modelId}`;
                
                card.onclick = (e) => {
                    if (e.target.closest('.delete-card-btn')) return;
                    window.location.href = `product.html?id=${modelId}`;
                };

                card.innerHTML = `
                    <button class="delete-card-btn" onclick="event.stopPropagation(); deleteModel('${modelId}')">&times;</button>
                    <div class="card-media-wrapper" onmouseleave="resetCardImage('${modelId}')">
                        <img id="card-img-${modelId}" src="${imgUrls[0]}" class="product-img" alt="${title}" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';">
                        ${hasMultiple ? `
                            <div class="card-progress-bars">
                                ${imgUrls.map((_, idx) => `<div class="card-progress-bar ${idx === 0 ? 'active' : ''}" id="bar-${modelId}-${idx}"></div>`).join('')}
                            </div>
                            <div class="card-hover-zones">
                                ${imgUrls.map((_, idx) => `
                                    <div class="card-hover-segment" onmouseenter="changeCardImage('${modelId}', ${idx})" onmousemove="changeCardImage('${modelId}', ${idx})"></div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${title}</div>
                        <div class="product-price">${price} $</div>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (error) { grid.innerHTML = `<div style="color: #ef4444; padding: 20px;">Ошибка загрузки: ${error.message}</div>`; }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        if (!token) { renderUnauthenticatedUI(); return; }

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/users/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const user = await res.json();
                if (user && user.username) {
                    localStorage.setItem('username', user.username);
                    document.getElementById('user-name').textContent = user.username;
                    document.getElementById('user-nick').textContent = '@' + user.username.toLowerCase().replace(/\s+/g, '');
                    document.getElementById('user-avatar').textContent = user.username.charAt(0).toUpperCase();
                    
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('openModalBtn').style.display = 'inline-block';
                    loadUserModels();
                } else { renderUnauthenticatedUI(); }
            } else { renderUnauthenticatedUI(); }
        } catch (err) {
            console.error("Ошибка при получении профиля:", err);
            renderUnauthenticatedUI();
        }
    });

    const modal = document.getElementById("myModal");
    const btn = document.getElementById("openModalBtn");
    const span = document.getElementById("closeModalBtn");

    if (btn && modal && span) {
        btn.onclick = function() { modal.style.display = "flex"; }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) { 
            if (event.target == modal) modal.style.display = "none"; 
            if (event.target == document.getElementById("authModal")) closeAuthModal();
        }
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        if (!token) { showToast("Ошибка авторизации!", true); return; }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Загрузка файлов...";

        const fileInput = document.getElementById('model-file').files[0];
        const glbFileInput = document.getElementById('model-glb').files[0];
        const imgInputFiles = document.getElementById('model-img').files;

        try {
            async function uploadToMediaLibrary(file) {
                const fileData = new FormData();
                fileData.append('files', file);
                const res = await fetch(`${STRAPI_BASE_URL}/api/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: fileData
                });
                if (!res.ok) throw new Error(`Не удалось загрузить файл ${file.name}`);
                const uploadedFiles = await res.json();
                return uploadedFiles[0].id;
            }

            const fbxId = await uploadToMediaLibrary(fileInput);

            const imgIds = [];
            for (let i = 0; i < imgInputFiles.length; i++) {
                submitBtn.textContent = `Загрузка фото (${i + 1}/${imgInputFiles.length})...`;
                const uploadedId = await uploadToMediaLibrary(imgInputFiles[i]);
                imgIds.push(uploadedId);
            }

            let glbId;
            if (glbFileInput) {
                submitBtn.textContent = "Загрузка 3D GLB плеера...";
                glbId = await uploadToMediaLibrary(glbFileInput);
            } else {
                const dummyFile = new File(["placeholder_content"], "empty.glb", { type: "application/octet-stream" });
                glbId = await uploadToMediaLibrary(dummyFile);
            }

            submitBtn.textContent = "Создание карточки...";

            const finalPayload = {
                data: {
                    Title: document.getElementById('model-title').value.trim(),
                    Price: parseFloat(document.getElementById('model-price').value.trim()) || 0,
                    Description: document.getElementById('model-desc').value.trim(),
                    Polygons: document.getElementById('model-polygons').value.trim(),
                    Category: document.getElementById('model-category').value,
                    ModelFBX: fbxId,
                    Previews: imgIds, 
                    ModelGLB: glbId
                }
            };

            const response = await fetch(`${STRAPI_BASE_URL}/api/models`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(finalPayload)
            });

            if (response.ok) {
                showToast("Модель успешно создана!");
                document.getElementById('upload-form').reset();
                if (modal) modal.style.display = "none";
                loadUserModels();
            } else {
                const errJson = await response.json().catch(() => ({}));
                const strapiErrorMessage = errJson?.error?.message || "Ошибка сохранения карточки";
                showToast(strapiErrorMessage, true);
            }
        } catch (error) {
            showToast(`Ошибка: ${error.message}`, true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Опубликовать";
        }
    });
</script>
</body>
</html>
