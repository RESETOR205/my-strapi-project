<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Details | Knight Hub</title>
    
    <!-- Подключаем 3D-движок Google <model-viewer> -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f111a; color: #fff; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo-link { color: #fff; text-decoration: none; font-size: 28px; font-weight: bold; }
        .back-btn { padding: 10px 20px; background: #334155; border: none; border-radius: 8px; color: #fff; text-decoration: none; font-weight: bold; }
        .back-btn:hover { background: #475569; }

        .product-container { display: grid; grid-template-columns: 1fr 380px; gap: 30px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 900px) { .product-container { grid-template-columns: 1fr; } }

        /* Левая часть: просмотрщик и галерея */
        .viewer-section { display: flex; flex-direction: column; gap: 15px; }
        
        .main-media-box { 
            background: #1a1d29; 
            border-radius: 16px; 
            padding: 10px; 
            border: 1px solid #334155; 
            position: relative; 
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            display: block;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #0f111a;
            border-radius: 12px;
            display: none;
        }

        .viewer-controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 17, 26, 0.85);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #94a3b8;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            z-index: 11;
        }

        .thumbnails-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .thumb-item {
            width: 80px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            background: #1a1d29;
            transition: border-color 0.2s ease;
            flex-shrink: 0;
        }
        .thumb-item:hover, .thumb-item.active {
            border-color: #6366f1;
        }

        .thumb-3d-btn {
            width: 80px;
            height: 60px;
            border-radius: 8px;
            background: #312e81;
            color: #818cf8;
            border: 2px solid #4f46e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            gap: 2px;
            transition: all 0.2s ease;
        }
        .thumb-3d-btn:hover, .thumb-3d-btn.active {
            background: #4338ca;
            color: #fff;
            border-color: #6366f1;
        }

        /* Правая колонка */
        .details-card { background: #1a1d29; border-radius: 16px; padding: 25px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 20px; height: fit-content; }
        .product-title { font-size: 26px; font-weight: bold; line-height: 1.2; }
        .product-price { font-size: 32px; font-weight: bold; color: #10b981; }
        
        .buy-btn {
            width: 100%;
            padding: 16px;
            background: #4f46e5;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .buy-btn:hover { background: #4338ca; }
        .buy-btn.in-cart { background: #10b981; }

        .specs-list { background: #0f111a; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .spec-item { display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }
        .spec-item:last-child { border-bottom: none; padding-bottom: 0; }
        .spec-label { color: #94a3b8; }
        .spec-value { color: #fff; font-weight: bold; }

        /* БЛОК АВТОРА */
        .author-box {
            background: #0f111a;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #1e293b;
        }
        .author-avatar {
            width: 48px;
            height: 48px;
            background: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .author-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: bold;
        }
        .author-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .description-box { color: #cbd5e1; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; background-color: #10b981; color: #fff; font-size: 14px; font-weight: 500; display: none; z-index: 2000; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header>
        <a href="index.html" class="logo-link">Knight Hub</a>
        <div style="display: flex; gap: 10px;">
            <a href="cart.html" class="back-btn" style="background: #4f46e5;">🛒 Cart</a>
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
        </div>
    </header>

    <div class="product-container">
        <!-- Левая колонка -->
        <div class="viewer-section">
            <div class="main-media-box">
                <img id="main-image" class="main-image" src="" alt="Model Preview">
                
                <model-viewer 
                    id="3d-viewer" 
                    alt="3D Model Preview" 
                    camera-controls 
                    auto-rotate 
                    shadow-intensity="1.5"
                    exposure="1">
                </model-viewer>

                <div id="viewer-hint" class="viewer-controls-hint">🖱️ Left click & drag to rotate &bull; Scroll to zoom</div>
            </div>

            <div class="thumbnails-list" id="thumbnails-container"></div>
        </div>

        <!-- Правая колонка -->
        <div class="details-card">
            <h1 class="product-title" id="p-title">Loading...</h1>
            <div class="product-price" id="p-price">0 $</div>
            
            <button class="buy-btn" id="p-buy-btn" onclick="toggleCartCurrentModel()">Add to Cart</button>

            <!-- ОКОШКО АВТОРА -->
            <div class="author-box">
                <div class="author-avatar" id="author-avatar">?</div>
                <div class="author-info">
                    <span class="author-label">Created by</span>
                    <span class="author-name" id="p-author">Loading...</span>
                </div>
            </div>

            <div class="specs-list">
                <div class="spec-item">
                    <span class="spec-label">Category:</span>
                    <span class="spec-value" id="p-category">—</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Polygons:</span>
                    <span class="spec-value" id="p-polygons">—</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">File Format:</span>
                    <span class="spec-value">FBX / GLB</span>
                </div>
            </div>

            <div class="description-box" id="p-desc">
                Loading description...
            </div>
        </div>
    </div>

<script>
    const STRAPI_BASE_URL = 'https://my-strapi-project-production-f85a.up.railway.app';
    const FALLBACK_IMG = 'https://placehold.co/800x600/1a1d29/94a3b8?text=No+Preview';

    let currentGlbUrl = "";
    let imageGallery = [];
    let currentModelId = null;

    const mainImgEl = document.getElementById('main-image');
    const viewerEl = document.getElementById('3d-viewer');
    const hintEl = document.getElementById('viewer-hint');
    const thumbsContainer = document.getElementById('thumbnails-container');

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Добавление в корзину с текущей страницы
    window.toggleCartCurrentModel = function() {
        if (!currentModelId) return;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const index = cart.indexOf(currentModelId);
        const buyBtn = document.getElementById('p-buy-btn');

        if (index === -1) {
            cart.push(currentModelId);
            buyBtn.textContent = "In Cart ✓";
            buyBtn.classList.add('in-cart');
            showToast('Added to Cart 🛒');
        } else {
            cart.splice(index, 1);
            buyBtn.textContent = "Add to Cart";
            buyBtn.classList.remove('in-cart');
            showToast('Removed from Cart');
        }
        localStorage.setItem('cart', JSON.stringify(cart));
    };

    // Проверка статуса корзины при загрузке
    function checkCartStatus() {
        if (!currentModelId) return;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const buyBtn = document.getElementById('p-buy-btn');
        if (cart.includes(currentModelId)) {
            buyBtn.textContent = "In Cart ✓";
            buyBtn.classList.add('in-cart');
        } else {
            buyBtn.textContent = "Add to Cart";
            buyBtn.classList.remove('in-cart');
        }
    }

    function activate3DView() {
        if (!currentGlbUrl) return;
        mainImgEl.style.display = 'none';
        viewerEl.style.display = 'block';
        if (!viewerEl.getAttribute('src')) {
            viewerEl.setAttribute('src', currentGlbUrl);
        }
        hintEl.style.display = 'block';

        document.querySelectorAll('.thumb-item, .thumb-3d-btn').forEach(el => el.classList.remove('active'));
        const active3dThumb = document.getElementById('thumb-3d-icon');
        if (active3dThumb) active3dThumb.classList.add('active');
    }

    function activateImageView(imgUrl, index) {
        viewerEl.style.display = 'none';
        hintEl.style.display = 'none';
        mainImgEl.src = imgUrl;
        mainImgEl.style.display = 'block';

        document.querySelectorAll('.thumb-item, .thumb-3d-btn').forEach(el => el.classList.remove('active'));
        const targetThumb = document.getElementById(`thumb-img-${index}`);
        if (targetThumb) targetThumb.classList.add('active');
    }

    async function loadProductDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        currentModelId = urlParams.get('id');

        if (!currentModelId) {
            alert("Model not found!");
            window.location.href = "index.html";
            return;
        }

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/models/${currentModelId}?populate=*`);
            if (!res.ok) throw new Error("Failed to load model data");

            const responseData = await res.json();
            const item = responseData.data;
            const attrs = item.attributes || item;

            // Заполняем текстовую информацию
            document.getElementById('p-title').textContent = attrs.Title || "Untitled";
            document.getElementById('p-price').textContent = `${attrs.Price !== undefined ? attrs.Price : 0} $`;
            
            // Заполняем данные автора и аватарку
            const authorName = attrs.ownerUsername ? attrs.ownerUsername : 'Community Artist';
            document.getElementById('p-author').textContent = '@' + authorName;
            document.getElementById('author-avatar').textContent = authorName.charAt(0).toUpperCase();

            document.getElementById('p-polygons').textContent = attrs.Polygons || "Not specified";
            
            const categoryValue = attrs.Category || attrs.category || "props";
            document.getElementById('p-category').textContent = categoryValue.toUpperCase();
            document.getElementById('p-desc').textContent = attrs.Description || "No description available.";

            // Проверяем, есть ли товар в корзине
            checkCartStatus();

            // Превью фото
            let rawPreviews = attrs.Previews || item.Previews;
            if (rawPreviews && rawPreviews.data) rawPreviews = rawPreviews.data;
            
            imageGallery = [];
            if (rawPreviews) {
                const previewsArray = Array.isArray(rawPreviews) ? rawPreviews : [rawPreviews];
                previewsArray.forEach(p => {
                    const target = p.attributes || p;
                    const url = target.url || p.url || '';
                    if (url) {
                        const fullUrl = url.startsWith('http') ? url : `${STRAPI_BASE_URL}${url}`;
                        imageGallery.push(fullUrl);
                    }
                });
            }

            if (imageGallery.length === 0) {
                imageGallery.push(FALLBACK_IMG);
            }

            mainImgEl.src = imageGallery[0];

            // 3D GLB файл
            const rawGlb = attrs.ModelGLB || item.ModelGLB;
            if (rawGlb) {
                const target = rawGlb.data ? rawGlb.data.attributes : (rawGlb.attributes || rawGlb);
                const url = target?.url || "";
                const size = target?.size || 0;
                
                if (url && (size > 1 || !url.includes('empty.glb'))) {
                    currentGlbUrl = url.startsWith('http') ? url : `${STRAPI_BASE_URL}${url}`;
                }
            }

            thumbsContainer.innerHTML = '';

            // Добавляем миниатюру 3D, если файл есть
            if (currentGlbUrl) {
                const btn3dThumb = document.createElement('div');
                btn3dThumb.className = 'thumb-3d-btn';
                btn3dThumb.id = 'thumb-3d-icon';
                btn3dThumb.innerHTML = '<span>🎲</span> 3D VIEW';
                btn3dThumb.onclick = activate3DView;
                thumbsContainer.appendChild(btn3dThumb);
            }

            // Добавляем обычные фото
            imageGallery.forEach((url, index) => {
                const imgThumb = document.createElement('img');
                imgThumb.className = `thumb-item ${index === 0 ? 'active' : ''}`;
                imgThumb.id = `thumb-img-${index}`;
                imgThumb.src = url;
                imgThumb.onclick = () => activateImageView(url, index);
                thumbsContainer.appendChild(imgThumb);
            });

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('p-title').textContent = "Error loading model details";
        }
    }

    document.addEventListener("DOMContentLoaded", loadProductDetails);
</script>
</body>
</html>
