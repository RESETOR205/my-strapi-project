<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success | Knight Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0f12; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .success-card { background-color: #161a23; border: 1px solid #2d3748; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .success-icon { font-size: 45px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .subtitle { color: #a0aec0; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .downloads-container { text-align: left; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
        .download-item { background: #1a202c; border: 1px solid #2d3748; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .download-info { font-weight: 600; font-size: 15px; color: #fff; }
        .download-btn { background-color: #10b981; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; white-space: nowrap; transition: background 0.2s; }
        .download-btn:hover { background-color: #059669; }
        
        .home-btn { display: inline-block; width: 100%; padding: 14px; background-color: #3b82f6; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; text-decoration: none; transition: background 0.2s; }
        .home-btn:hover { background-color: #2563eb; }
        
        .loading { color: #a0aec0; font-style: italic; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">🎉</div>
        <h1 class="title">Payment Successful!</h1>
        <p class="subtitle">Thank you for your purchase. Your transaction has been successfully processed. You can download your 3D models below.</p>
        
        <div id="loading-text" class="loading">Preparing your download links...</div>
        <div class="downloads-container" id="downloads-container"></div>

        <a href="index.html" class="home-btn">Return to Marketplace</a>
    </div>

    <script>
        const STRAPI_BASE_URL = 'https://api.knighthubs.xyz';

        // 🔒 ЗАЩИТА ОТ XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function safeDownloadUrl(url) {
            if (!url || url === '#') return '#';
            try {
                const parsed = new URL(url);
                if (['http:', 'https:'].includes(parsed.protocol)) {
                    return escapeHtml(url);
                }
            } catch(e) {}
            return '#';
        }

        async function initSuccessPage() {
            const container = document.getElementById('downloads-container');
            const loadingText = document.getElementById('loading-text');
            
            // Достаем сохраненную корзину перед очисткой
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                loadingText.style.display = 'none';
                container.innerHTML = '<p style="text-align: center; color: #a0aec0;">No active purchases found in session.</p>';
                return;
            }

            try {
                const res = await fetch(`${STRAPI_BASE_URL}/api/models?populate=*`);
                if (!res.ok) throw new Error('Failed to fetch models');
                const responseData = await res.json();
                const allModels = responseData.data || [];

                const purchasedModels = allModels.filter(item => {
                    const id = item.documentId || item.id;
                    return cart.includes(id);
                });

                loadingText.style.display = 'none';

                if (purchasedModels.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #a0aec0;">Models data not available.</p>';
                    return;
                }

                container.innerHTML = purchasedModels.map(item => {
                    const m = item.attributes || item;
                    const safeTitle = escapeHtml(m.Title || '3D Model');
                    
                    let fileUrl = '#';
                    const fileField = m.File?.data || m.File;
                    if (fileField) {
                        const url = fileField.attributes?.url || fileField.url;
                        if (url) {
                            fileUrl = url.startsWith('http') ? url : STRAPI_BASE_URL + url;
                        }
                    }

                    const validatedUrl = safeDownloadUrl(fileUrl);

                    return `
                        <div class="download-item">
                            <span class="download-info">📦 ${safeTitle}</span>
                            <a href="${validatedUrl}" class="download-btn" target="_blank" rel="noopener noreferrer" download>Download</a>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading purchased files:', err);
                loadingText.textContent = 'Could not load download links automatically. Please check your account profile.';
            }

            // Очищаем корзину после обработки заказа
            localStorage.removeItem('cart');
        }

        document.addEventListener('DOMContentLoaded', initSuccessPage);
    </script>
</body>
</html>
