<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | 3D Market</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f111a; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo-link { color: #fff; text-decoration: none; font-size: 28px; font-weight: bold; }
        .back-btn { padding: 10px 20px; background: #334155; border: none; border-radius: 8px; color: #fff; text-decoration: none; }
        .back-btn:hover { background: #475569; }
        .profile-container { display: flex; align-items: center; gap: 25px; background: #1a1d29; padding: 30px; border-radius: 16px; margin-bottom: 20px; position: relative; }
        .profile-avatar { width: 100px; height: 100px; background: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; text-transform: uppercase; }
        .profile-info { display: flex; flex-direction: column; gap: 8px; }
        .profile-header-row { display: flex; align-items: center; gap: 15px; }
        .profile-nick { font-size: 20px; color: #94a3b8; font-weight: normal; text-transform: lowercase; }
        .profile-rating { display: flex; align-items: center; gap: 5px; color: #f59e0b; font-size: 18px; font-weight: bold; }
        .profile-reviews { color: #64748b; font-size: 14px; }
        .profile-username { font-size: 32px; font-weight: bold; letter-spacing: 1px; }
        
        .logout-btn { padding: 8px 16px; background: #ef4444; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-left: auto; transition: background 0.2s; }
        .logout-btn:hover { background: #dc2626; }
        .login-btn-profile { padding: 10px 20px; background: #4f46e5; border: none; border-radius: 8px; color: #fff; font-weight: bold; text-decoration: none; margin-left: auto; display: inline-block; transition: background 0.2s; cursor: pointer; }
        .login-btn-profile:hover { background: #4338ca; }

        .section-title-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #94a3b8; }
        .add-product-btn { padding: 8px 16px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-decoration: none; }
        .add-product-btn:hover { background: #16a34a; }
        
        .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .product-card { 
            position: relative; 
            background: #1a1d29; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            border: 1px solid transparent; 
            transition: transform 0.3s ease, border-color 0.3s ease, opacity 0.4s ease; 
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-4px); border-color: #4f46e5; }
        
        .card-media-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #0f111a;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .card-progress-bars {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        .card-progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .card-progress-bar.active {
            background: #6366f1;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.8);
        }
        
        .card-hover-zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 6;
        }
        .card-hover-segment {
            flex: 1;
            height: 100%;
            cursor: pointer;
        }

        .delete-card-btn {
            position: absolute;
            top: 22px;
            right: 22px;
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .delete-card-btn:hover { background: #ef4444; transform: scale(1.1); }
        .product-info { padding: 5px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 18px; margin-bottom: 8px; color: #fff; }
        .product-price { font-size: 20px; font-weight: bold; color: #10b981; margin-top: auto; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15,17,26,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: #1a1d29; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 28px; color: #94a3b8; cursor: pointer; }
        .close-modal:hover { color: #fff; }
        .modal h2 { margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #0f111a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .form-group select option { background: #1a1d29; color: #fff; }
        .submit-btn { width: 100%; padding: 12px; background: #4f46e5; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #4338ca; }
        .btn-secondary { background: #334155; margin-top: 10px; }
        .btn-secondary:hover { background: #475569; }
        
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .auth-tab-btn { flex: 1; background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: bold; padding: 8px; cursor: pointer; }
        .auth-tab-btn.active { color: #6366f1; border-bottom: 2px solid #6366f1; }
        .code-input-field { letter-spacing: 8px; font-size: 22px; text-align: center; font-weight: bold; }

        .toast-notification { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: none; }
        .version-badge { font-size: 11px; color: #22c55e; background: rgba(34,197,94,0.1); padding: 2px 6px; border-radius: 4px; float: right; }
    </style>
</head>
<body>

    <div id="toast" class="toast-notification"></div>

    <header>
        <a href="index.html" class="logo-link">3D Market</a>
        <a href="index.html" class="back-btn">— Back to Home</a>
    </header>

    <div class="profile-container">
        <div class="profile-avatar" id="user-avatar">?</div>
        <div class="profile-info">
            <div class="profile-header-row">
                <div class="profile-username" id="user-name">Loading...</div>
                <div class="profile-nick" id="user-nick">@username</div>
            </div>
            <div class="profile-header-row">
                <div class="profile-rating">★ 5.0</div>
                <div class="profile-reviews">(0 reviews)</div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logoutUser()">Log Out</button>
        <button class="login-btn-profile" id="loginBtn" style="display: none;" onclick="openAuthModal()">Log In / Sign Up</button>
    </div>

    <!-- БЛОК НАСТРОЕК КОШЕЛЬКА (Скрыт по умолчанию) -->
    <div class="wallet-section" id="wallet-section" style="display: none; background: #1a1d29; padding: 25px; border-radius: 16px; margin-bottom: 40px;">
        <h2 style="font-size: 20px; color: #fff; margin-bottom: 15px;">Payout Settings (Wallet)</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
                <label style="color: #94a3b8;">Network (e.g. USDT TRC20)</label>
                <input type="text" id="wallet-network" placeholder="USDT TRC20">
            </div>
            <div class="form-group" style="flex: 2; min-width: 250px; margin-bottom: 0;">
                <label style="color: #94a3b8;">Wallet Address</label>
                <input type="text" id="wallet-address" placeholder="T...">
            </div>
        </div>
        <button onclick="saveWallet()" class="submit-btn" style="width: auto; padding: 10px 25px; margin-top: 15px;">Save Wallet</button>
    </div>

    <div class="section-title-bar">
        <div class="section-title">My Artworks</div>
        <button class="add-product-btn" id="openModalBtn">+ Add Model</button>
    </div>

    <div class="works-grid" id="user-models-grid">
        <div style="color: #94a3b8; padding: 20px;">Loading your models...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2>Delete Model</h2>
            <p style="color: #94a3b8; margin-bottom: 25px; line-height: 1.5;">Are you sure you want to permanently delete this model?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="submit-btn" style="background: #ef4444; margin-top: 0;" onclick="executeDelete()">Delete</button>
                <button class="submit-btn btn-secondary" style="margin-top: 0;" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ МОДЕЛИ -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2>Publish New Artwork</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label for="model-title">Model Title</label>
                    <input type="text" id="model-title" required placeholder="e.g. Glock 17">
                </div>
                
                <div class="form-group">
                    <label for="model-category">Category</label>
                    <select id="model-category" required>
                        <option value="characters">Characters</option>
                        <option value="weapons">Weapons</option>
                        <option value="environment">Environment</option>
                        <option value="vehicles">Vehicles</option>
                        <option value="architecture">Architecture</option>
                        <option value="props" selected>Props / Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model-file">Main Model File (.fbx, .obj, .zip)</label>
                    <input type="file" id="model-file" accept=".fbx,.obj,.zip" required>
                </div>

                <div class="form-group">
                    <label for="model-glb">3D Viewer File (.glb) <span style="color:#64748b;">(Optional)</span></label>
                    <input type="file" id="model-glb" accept=".glb,.gltf">
                </div>

                <div class="form-group">
                    <label for="model-polygons">Polygon Count</label>
                    <input type="text" id="model-polygons" required placeholder="e.g. 12500 or 12k">
                </div>
                <div class="form-group">
                    <label for="model-price">Price (numbers only)</label>
                    <input type="text" id="model-price" required placeholder="19">
                </div>
                <div class="form-group">
                    <label for="model-img">Photos / Previews (multiple images)</label>
                    <input type="file" id="model-img" accept="image/*" multiple required>
                </div>
                <div class="form-group">
                    <label for="model-desc">Description</label>
                    <textarea id="model-desc" rows="3" placeholder="Describe your 3D model..."></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Publish</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ И РЕГИСТРАЦИИ -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAuthModal()">&times;</span>
            <span class="version-badge">v4.3 USERNAME-FILTER</span>
            
            <div class="auth-tabs" id="auth-tabs-header">
                <button class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">Sign Up</button>
            </div>

            <!-- Форма Входа -->
            <div id="auth-login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="login-identifier" placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button type="button" class="submit-btn" id="login-submit-btn" onclick="handleLogin()">Log In</button>
            </div>

            <!-- БЛОК РЕГИСТРАЦИИ -->
            <div id="auth-register-form" style="display: none;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" placeholder="User3D">
                </div>
                <div class="form-group">
                    <label>Email (for verification)</label>
                    <input type="email" id="reg-email" placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••">
                </div>

                <button type="button" class="submit-btn" id="reg-step1-btn" onclick="goToStep2()">Sign Up</button>
            </div>

            <!-- БЛОК ВВОДА 6-ЗНАЧНОГО КОДА -->
            <div id="auth-verify-form" style="display: none;">
                <h2 style="text-align: center;">Email Verification</h2>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px; text-align: center;">
                    We sent a 6-digit code to:<br><b id="target-email-display" style="color: #6366f1;"></b>
                </p>
                <div class="form-group">
                    <input type="text" id="verify-code-input" class="code-input-field" maxlength="6" placeholder="123456" autocomplete="off">
                </div>
                <button type="button" class="submit-btn" id="verify-btn" onclick="handleVerifyCodeDirect()">Verify Code</button>
                <button type="button" class="submit-btn btn-secondary" onclick="resetRegisterStep()">Back</button>
            </div>
        </div>
    </div>

<script>
    const STRAPI_BASE_URL = 'https://my-strapi-project-production-f85a.up.railway.app';
    const FALLBACK_IMG = 'https://placehold.co/600x400/1a1d29/94a3b8?text=No+Preview';
    
    const modelGalleries = {};
    let pendingRegisterEmail = '';
    let modelToDeleteId = null; 

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#22c55e';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function logoutUser() {
        localStorage.removeItem('token');
        localStorage.removeItem('jwt');
        localStorage.removeItem('username');
        localStorage.removeItem('user');
        showToast("You have logged out");
        setTimeout(() => { window.location.reload(); }, 500);
    }

    function renderUnauthenticatedUI() {
        localStorage.removeItem('token');
        localStorage.removeItem('jwt');
        localStorage.removeItem('username');
        localStorage.removeItem('user');

        document.getElementById('user-name').textContent = "Not logged in";
        document.getElementById('user-nick').textContent = "";
        document.getElementById('user-avatar').textContent = "?";
        
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('wallet-section').style.display = 'none'; // Скрываем кошелек
        
        const openBtn = document.getElementById('openModalBtn');
        if (openBtn) openBtn.style.display = 'none';

        const grid = document.getElementById('user-models-grid');
        if (grid) {
            grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">Please log in to manage your models.</div>';
        }
    }

    function openAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
        switchAuthTab('login');
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    function switchAuthTab(tab) {
        document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
        
        document.getElementById('auth-login-form').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('auth-register-form').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('auth-verify-form').style.display = 'none';
        document.getElementById('auth-tabs-header').style.display = 'flex';
    }

    async function handleLogin() {
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;
        const submitBtn = document.getElementById('login-submit-btn');

        if (!identifier || !password) {
            showToast("Please fill in all login fields!", true);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/auth/local`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'Login error');

            localStorage.setItem('jwt', data.jwt);
            localStorage.setItem('token', data.jwt);
            localStorage.setItem('user', JSON.stringify(data.user));

            showToast("Login successful!");
            closeAuthModal();
            window.location.reload(); 
            
        } catch (err) {
            showToast("LOGIN ERROR: " + err.message, true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
        }
    }

    function goToStep2() {
        document.getElementById('auth-register-form').style.display = 'none';
        document.getElementById('auth-verify-form').style.display = 'block';
        document.getElementById('auth-tabs-header').style.display = 'none';

        const emailInput = document.getElementById('reg-email');
        const email = emailInput ? emailInput.value.trim() : '';
        document.getElementById('target-email-display').textContent = email || 'your email';

        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!username || !email || !password) {
            showToast("Warning: Fill in all fields to receive the code!", true);
            return;
        }

        sendRegisterCodeInBackground(username, email, password);
    }

    async function sendRegisterCodeInBackground(username, email, password) {
        pendingRegisterEmail = email;
        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/email-auth/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await res.json();
            if (!res.ok) {
                showToast("Backend error: " + (data.error?.message || data.message || "Unknown error"), true);
            } else {
                showToast("Code sent successfully to your email!");
            }
        } catch (err) {
            console.error("Network error:", err);
            showToast("Server connection error: " + err.message, true);
        }
    }

    async function handleVerifyCodeDirect() {
        const code = document.getElementById('verify-code-input').value.trim();

        if (!code || code.length !== 6) {
            showToast("Enter the 6-digit code from the email!", true);
            return;
        }

        const btn = document.getElementById('verify-btn');
        btn.disabled = true;
        btn.textContent = "Verifying...";

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/email-auth/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingRegisterEmail, code })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || 'Invalid code!');

            localStorage.setItem('jwt', data.jwt);
            localStorage.setItem('token', data.jwt); 
            localStorage.setItem('user', JSON.stringify(data.user));

            showToast("Account verified successfully!");
            closeAuthModal();
            window.location.reload();
        } catch (err) {
            showToast("VERIFICATION ERROR: " + err.message, true);
        } finally {
            btn.disabled = false;
            btn.textContent = "Verify Code";
        }
    }

    function resetRegisterStep() {
        document.getElementById('auth-tabs-header').style.display = 'flex';
        document.getElementById('auth-verify-form').style.display = 'none';
        switchAuthTab('register');
    }

    // --- ФУНКЦИИ КОШЕЛЬКА ---
    async function loadWallet() {
        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        if (!token) return;
        
        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/users/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const userData = await res.json();
                if (userData.walletNetwork) document.getElementById('wallet-network').value = userData.walletNetwork;
                if (userData.walletAddress) document.getElementById('wallet-address').value = userData.walletAddress;
            }
        } catch (error) {
            console.error('Ошибка загрузки кошелька:', error);
        }
    }

    async function saveWallet() {
        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        if (!token || !userStr) {
            showToast('Сначала нужно войти в аккаунт!', true);
            return;
        }

        const user = JSON.parse(userStr);
        const network = document.getElementById('wallet-network').value.trim();
        const address = document.getElementById('wallet-address').value.trim();

        try {
            const response = await fetch(`${STRAPI_BASE_URL}/api/users/${user.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    walletNetwork: network,
                    walletAddress: address
                })
            });

            if (response.ok) {
                showToast('Реквизиты кошелька успешно сохранены!');
            } else {
                showToast('Ошибка сохранения. Убедитесь, что в Strapi разрешено обновление (update) для роли Authenticated.', true);
            }
        } catch (error) {
            console.error('Ошибка сохранения:', error);
            showToast('Ошибка соединения с сервером.', true);
        }
    }

    /* --- ЛОГИКА ВИТРИНЫ И КАРТОЧЕК --- */
    function changeCardImage(modelId, index) {
        const gallery = modelGalleries[modelId];
        if (!gallery || !gallery[index]) return;

        const imgEl = document.getElementById(`card-img-${modelId}`);
        if (imgEl) imgEl.src = gallery[index];

        gallery.forEach((_, idx) => {
            const barEl = document.getElementById(`bar-${modelId}-${idx}`);
            if (barEl) {
                if (idx === index) barEl.classList.add('active');
                else barEl.classList.remove('active');
            }
        });
    }

    function resetCardImage(modelId) { changeCardImage(modelId, 0); }

    function openDeleteModal(modelId) {
        modelToDeleteId = modelId;
        document.getElementById('deleteConfirmModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        modelToDeleteId = null;
        document.getElementById('deleteConfirmModal').style.display = 'none';
    }

    async function executeDelete() {
        if (!modelToDeleteId) return;
        const modelId = modelToDeleteId;
        closeDeleteModal(); 

        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        if (!token) { showToast("Authorization error.", true); return; }

        try {
            const response = await fetch(`${STRAPI_BASE_URL}/api/models/${modelId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });

            if (response.status === 200 || response.status === 204) {
                showToast("Model deleted successfully!");
                const cardEl = document.getElementById(`model-card-${modelId}`);
                if (cardEl) {
                    cardEl.style.opacity = '0';
                    cardEl.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        cardEl.remove();
                        const grid = document.getElementById('user-models-grid');
                        if (grid.querySelectorAll('[id^="model-card-"]').length === 0) {
                            grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">You haven\'t published any models yet</div>';
                        }
                    }, 400);
                }
                return;
            } 
            const errorText = await response.text();
            showToast(`Error: ${errorText}`, true);
        } catch (error) { showToast(`Network error: ${error.message}`, true); }
    }

    async function loadUserModels() {
        const grid = document.getElementById('user-models-grid');
        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        if (!grid) return;

        const userObj = JSON.parse(localStorage.getItem('user') || '{}');
        const currentUsername = userObj.username || localStorage.getItem('username');

        if (!currentUsername) {
            grid.innerHTML = '<div style="color: #ef4444; padding: 20px;">Error: Username not found</div>';
            return;
        }

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/models?populate=*&_t=${Date.now()}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error("Failed to load your artworks.");

            const responseData = await res.json();
            const allModels = responseData.data || [];

            // Фильтруем модели по имени автора (ownerUsername)
            const models = allModels.filter(item => {
                const attrs = item.attributes || item;
                return attrs.ownerUsername === currentUsername;
            });

            if (models.length === 0) {
                grid.innerHTML = '<div style="color: #94a3b8; padding: 20px;">You haven\'t published any models yet</div>';
                return;
            }

            grid.innerHTML = ''; 

            models.forEach(item => {
                const modelId = item.documentId || item.id;
                const attrs = item.attributes || item;
                const title = attrs.Title || "Untitled";
                const price = attrs.Price !== undefined ? attrs.Price : 0;

                let imgUrls = [];
                let rawPreviews = attrs.Previews || item.Previews;
                if (rawPreviews && rawPreviews.data) rawPreviews = rawPreviews.data;
                if (rawPreviews) {
                    const previewsArray = Array.isArray(rawPreviews) ? rawPreviews : [rawPreviews];
                    previewsArray.forEach(p => {
                        const target = p.attributes || p;
                        const url = target.url || p.url || '';
                        if (url) {
                            const fullUrl = url.startsWith('http') ? url : `${STRAPI_BASE_URL}${url}`;
                            imgUrls.push(fullUrl);
                        }
                    });
                }

                if (imgUrls.length === 0) imgUrls.push(FALLBACK_IMG);

                modelGalleries[modelId] = imgUrls;
                const hasMultiple = imgUrls.length > 1;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.id = `model-card-${modelId}`;
                
                card.onclick = (e) => {
                    if (e.target.closest('.delete-card-btn')) return;
                    window.location.href = `product.html?id=${modelId}`;
                };

                card.innerHTML = `
                    <button class="delete-card-btn" onclick="event.stopPropagation(); openDeleteModal('${modelId}')">&times;</button>
                    <div class="card-media-wrapper" onmouseleave="resetCardImage('${modelId}')">
                        <img id="card-img-${modelId}" src="${imgUrls[0]}" class="product-img" alt="${title}" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';">
                        ${hasMultiple ? `
                            <div class="card-progress-bars">
                                ${imgUrls.map((_, idx) => `<div class="card-progress-bar ${idx === 0 ? 'active' : ''}" id="bar-${modelId}-${idx}"></div>`).join('')}
                            </div>
                            <div class="card-hover-zones">
                                ${imgUrls.map((_, idx) => `
                                    <div class="card-hover-segment" onmouseenter="changeCardImage('${modelId}', ${idx})" onmousemove="changeCardImage('${modelId}', ${idx})"></div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${title}</div>
                        <div class="product-price">${price} $</div>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (error) { grid.innerHTML = `<div style="color: #ef4444; padding: 20px;">Loading error: ${error.message}</div>`; }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        if (!token) { renderUnauthenticatedUI(); return; }

        try {
            const res = await fetch(`${STRAPI_BASE_URL}/api/users/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const user = await res.json();
                if (user && user.username) {
                    localStorage.setItem('username', user.username);
                    localStorage.setItem('user', JSON.stringify(user));

                    document.getElementById('user-name').textContent = user.username;
                    document.getElementById('user-nick').textContent = '@' + user.username.toLowerCase().replace(/\s+/g, '');
                    document.getElementById('user-avatar').textContent = user.username.charAt(0).toUpperCase();
                    
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('openModalBtn').style.display = 'inline-block';
                    
                    // Показываем блок кошелька и грузим данные
                    document.getElementById('wallet-section').style.display = 'block';
                    loadWallet();
                    
                    loadUserModels();
                } else { renderUnauthenticatedUI(); }
            } else { renderUnauthenticatedUI(); }
        } catch (err) {
            console.error("Profile fetching error:", err);
            renderUnauthenticatedUI();
        }
    });

    const modal = document.getElementById("myModal");
    const btn = document.getElementById("openModalBtn");
    const span = document.getElementById("closeModalBtn");

    if (btn && modal && span) {
        btn.onclick = function() { modal.style.display = "flex"; }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) { 
            if (event.target == modal) modal.style.display = "none"; 
            if (event.target == document.getElementById("authModal")) closeAuthModal();
            if (event.target == document.getElementById("deleteConfirmModal")) closeDeleteModal();
        }
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('jwt') || localStorage.getItem('token');
        if (!token) { showToast("Authorization error!", true); return; }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Uploading files...";

        const fileInput = document.getElementById('model-file').files[0];
        const glbFileInput = document.getElementById('model-glb').files[0];
        const imgInputFiles = document.getElementById('model-img').files;

        const userObj = JSON.parse(localStorage.getItem('user') || '{}');
        const currentUsername = userObj.username || localStorage.getItem('username');

        try {
            async function uploadToMediaLibrary(file) {
                const fileData = new FormData();
                fileData.append('files', file);
                const res = await fetch(`${STRAPI_BASE_URL}/api/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: fileData
                });
                if (!res.ok) throw new Error(`Failed to upload file ${file.name}`);
                const uploadedFiles = await res.json();
                return uploadedFiles[0].id;
            }

            const fbxId = await uploadToMediaLibrary(fileInput);

            const imgIds = [];
            for (let i = 0; i < imgInputFiles.length; i++) {
                submitBtn.textContent = `Uploading photo (${i + 1}/${imgInputFiles.length})...`;
                const uploadedId = await uploadToMediaLibrary(imgInputFiles[i]);
                imgIds.push(uploadedId);
            }

            let glbId;
            if (glbFileInput) {
                submitBtn.textContent = "Uploading 3D GLB viewer...";
                glbId = await uploadToMediaLibrary(glbFileInput);
            } else {
                const dummyFile = new File(["placeholder_content"], "empty.glb", { type: "application/octet-stream" });
                glbId = await uploadToMediaLibrary(dummyFile);
            }

            submitBtn.textContent = "Creating listing...";

            const finalPayload = {
                data: {
                    Title: document.getElementById('model-title').value.trim(),
                    Price: parseFloat(document.getElementById('model-price').value.trim()) || 0,
                    Description: document.getElementById('model-desc').value.trim(),
                    Polygons: document.getElementById('model-polygons').value.trim(),
                    Category: document.getElementById('model-category').value,
                    ModelFBX: fbxId,
                    Previews: imgIds, 
                    ModelGLB: glbId,
                    ownerUsername: currentUsername 
                }
            };

            const response = await fetch(`${STRAPI_BASE_URL}/api/models`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(finalPayload)
            });

            if (response.ok) {
                showToast("Model created successfully!");
                document.getElementById('upload-form').reset();
                if (modal) modal.style.display = "none";
                loadUserModels();
            } else {
                const errJson = await response.json().catch(() => ({}));
                const strapiErrorMessage = errJson?.error?.message || "Error saving listing";
                showToast(strapiErrorMessage, true);
            }
        } catch (error) {
            showToast(`Error: ${error.message}`, true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Publish";
        }
    });
</script>
